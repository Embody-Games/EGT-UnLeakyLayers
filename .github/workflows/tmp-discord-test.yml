# TEMPORARY. Posts the current changelog entry so the formatting can be seen.
# Delete once checked.
name: tmp discord test

on:
  push:
    branches: [standardise-release-tooling]

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      PLUGIN_FILE: unleakylayers.js
      PLUGIN_NAME: UnLeaky Layers
      PLUGIN_COLOR: 5865F2
      DISCORD_THREAD_ID: '1545338164627906570'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post 1.2.1 to the forum thread
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/discord_notify.mjs 1.2.1
